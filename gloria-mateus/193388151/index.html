<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Los rosales — Ideal Homes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:      #00796b;
      --green-dark: #005047;
      --footer:     #002d27;
      --cream:      #fdece5;
      --bg:         #f4f6f5;
      --white:      #ffffff;
      --text:       #1a1a1a;
      --muted:      #6b7280;
      --border:     #e5e7eb;
      --radius:     14px;
      --shadow:     0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.06);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    nav {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text);
      text-decoration: none;
    }
    .logo span { color: var(--green); }
    footer {
      background: var(--footer);
      color: var(--cream);
      text-align: center;
      padding: 40px 24px;
    }
    .footer-logo { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 6px; }
    .footer-logo span { color: var(--green); }
    .footer-sub { font-size: 0.78rem; color: rgba(253,236,229,.45); }

    /* ── BACK LINK ── */
    .back-bar {
      max-width: 960px;
      margin: 0 auto;
      padding: 18px 20px 0;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.14s;
    }
    .back-link:hover { color: var(--green); }
    .back-link svg { width: 14px; height: 14px; }

    /* ── LAYOUT ── */
    .detail-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 20px 60px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 28px;
      align-items: start;
    }
    @media (max-width: 720px) {
      .detail-wrap { grid-template-columns: 1fr; }
    }

    /* ── GALLERY ── */
    .gallery-wrap { border-radius: var(--radius); overflow: hidden; background: var(--white); box-shadow: var(--shadow); }
    .main-slide {
      position: relative;
      height: 420px;
      background: #e8f0ee;
      overflow: hidden;
    }
    @media (max-width: 720px) { .main-slide { height: 260px; } }
    .slide {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .slide.active { opacity: 1; }
    .no-photo {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: #9ab8b3; font-size: 0.85rem; font-weight: 500;
    }
    .gallery-controls {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      pointer-events: none;
    }
    .gallery-controls button {
      pointer-events: all;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(4px);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,.15);
      transition: background 0.14s;
    }
    .gallery-controls button:hover { background: var(--white); }
    .slide-counter {
      position: absolute;
      bottom: 12px; right: 14px;
      background: rgba(0,0,0,.45);
      color: var(--white);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 100px;
    }
    .thumbs {
      display: flex;
      gap: 6px;
      padding: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      background: var(--white);
    }
    .thumbs::-webkit-scrollbar { display: none; }
    .thumb {
      width: 72px; height: 52px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.14s;
      flex-shrink: 0;
      border: 2px solid transparent;
    }
    .thumb.active, .thumb:hover { opacity: 1; border-color: var(--green); }

    /* ── INFO PANEL ── */
    .info-panel {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .info-barrio {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--green);
    }
    .info-price {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      color: var(--text);
    }
    .divider { height: 1px; background: var(--border); }
    .detail-grid { display: flex; flex-direction: column; gap: 10px; }
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .detail-label { color: var(--muted); font-weight: 500; }
    .detail-val { font-weight: 700; color: var(--text); }
    .agenda-box {
      background: #f0faf8;
      border: 1px solid #b2dfdb;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.82rem;
    }
    .agenda-box strong { color: var(--green-dark); display: block; margin-bottom: 4px; }
    .agenda-box p { color: var(--text); line-height: 1.5; }
    .cta {
      display: block;
      text-align: center;
      padding: 13px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.14s, color 0.14s;
    }
    .cta-ghost {
      background: transparent;
      color: var(--green);
      border: 1.5px solid var(--green);
    }
    .cta-ghost:hover { background: var(--green); color: var(--white); }
  </style>
</head>
<body>
  
  <nav>
    <a class="logo" href="../">ideal<span>HOMES</span></a>
  </nav>
  <div class="back-bar">
    <a href="../" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M5 12l7 7M5 12l7-7"/></svg>
      Volver a opciones
    </a>
  </div>

  <div class="detail-wrap">
    <div class="gallery-wrap">
      <div class="main-slide">
        <div class="no-photo">Sin fotos disponibles</div>
        
      </div>
      
    </div>

    <div class="info-panel">
      <div>
        <p class="info-barrio">Los rosales</p>
        <p class="info-price">$ 1.950 M</p>
      </div>
      <div class="divider"></div>
      <div class="detail-grid">
        <div class="detail-row"><span class="detail-label">Área</span><span class="detail-val">240 m²</span></div>
        <div class="detail-row"><span class="detail-label">Habitaciones</span><span class="detail-val">4</span></div>
        <div class="detail-row"><span class="detail-label">Baños</span><span class="detail-val">4</span></div>
        <div class="detail-row"><span class="detail-label">Parqueaderos</span><span class="detail-val">2</span></div>
        <div class="detail-row"><span class="detail-label">Año construcción</span><span class="detail-val">2022</span></div>
        <div class="detail-row"><span class="detail-label">Terraza</span><span class="detail-val">Sí</span></div>
        <div class="detail-row"><span class="detail-label">Barrio</span><span class="detail-val">Los rosales</span></div>
      </div>
      
      <div class="divider"></div><a href="https://v2.domus.la/file/property/MzI5MDIzNg==/MA==/MzMyMA==" target="_blank" rel="noopener" class="cta cta-ghost">Ver ficha multimedia</a>
    </div>
  </div>

  <footer>
    <div class="footer-logo">ideal<span>HOMES</span></div>
    <p class="footer-sub">Tu apartamento ideal te está esperando</p>
  </footer>

  
</body>
</html>
